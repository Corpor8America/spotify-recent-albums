services:
  caddy:
    image: caddy:2
    container_name: recent-albums-caddy
    ports:
      - "8443:8443"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
    depends_on:
      spotify-recent-albums:
        condition: service_healthy
    restart: unless-stopped

  spotify-recent-albums:
    image: ghcr.io/corpor8america/spotify-recent-albums:latest
    container_name: recent-albums
    expose:
      - "8080"
    volumes:
      - spotify_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/status', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

configs:
  caddyfile:
    content: |
      https://:8443 {
        tls internal {
          on_demand
        }
        reverse_proxy spotify-recent-albums:8080
      }

volumes:
  spotify_data:
  caddy_data:
